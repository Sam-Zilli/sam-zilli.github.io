<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sam Zilli</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
  <div class="hero">
    <div class="overlay">
      <header>
        <h1 class="band-name">Sam Zilli</h1>
        <nav>
          <ul>
            <li><a href="your-best-friends/your-best-friends.html">Your Best Friends</a></li>
            <li><a href="#" onclick="showSection(event, 'coding')">Coding</a></li>
            <li><a href="#" onclick="showSection(event, 'resume')">Resume</a></li>
            <li><a href="#" onclick="showSection(event, 'contact')">Contact</a></li>
            <li><a href="#" onclick="showSection(event, 'media')">Media</a></li>
          </ul>
        </nav>
      </header>
    </div>
  </div>

  <main>

    <section id="coding" class="content-section" style="display:none;">
      <h2>Coding</h2>
      <p>Content for Coding.</p>
    </section>

    <section id="resume" class="content-section" style="display:none;">
      <h2>Resume</h2>
      <p>Content for Resume.</p>
    </section>

    <section id="contact" class="content-section" style="display:none;">
      <h2>Contact</h2>
      <p>Content for Contact.</p>
    </section>

    <section id="media" class="content-section" style="display:none;">
      <h2>Media</h2>
      <p>Content for Media.</p>
    </section>
  </main>

  <script>
    function showSection(event, sectionId) {
      event.preventDefault(); // Prevent default anchor behavior
      const sections = document.querySelectorAll('.content-section');
      sections.forEach((section) => {
        section.style.display = (section.id === sectionId) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
